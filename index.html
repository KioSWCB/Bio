<!DOCTYPE HTML>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Kio</title>
  <link rel="icon" type="png" href="Avatar_round.png">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg-dark: #0d0d0d;
      --stripe-size: 40px;
      --wave-strong: 0.48;
      --wave-soft-alpha: 0.10;
      --wave-time-main: 6.2s;
      --wave-time-soft: 8.4s;
      --card-delay: 0.6s;
      --card-duration: 1s;
      --card-offset: 28px;
      --actions-delay-offset: 0.6s;
    }

    #preloader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Полосатый фон как у сайта для плавности */
      background-image: repeating-linear-gradient(
        -45deg,
        var(--bg-dark) 0px,
        var(--bg-dark) calc(var(--stripe-size)/2),
        #111 calc(var(--stripe-size)/2),
        #111 var(--stripe-size)
      );
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }


    @keyframes spin { to { transform: rotate(360deg); } }

    .profile-card, .actions-card {
      opacity: 0; 
      animation-play-state: paused !important;
    }

    body.loaded .profile-card,
    body.loaded .actions-card {
      animation-play-state: running !important;
    }


    html,body{height:100%;margin:0;}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Inter","Segoe UI",system-ui,sans-serif;
      background:var(--bg-dark);
      color:#f2f2f2;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:40px 20px;
      box-sizing:border-box;
    }

    .bg{
      position:fixed;
      inset:-6% -6%;
      z-index:-2;
      pointer-events:none;
      background:repeating-linear-gradient(
        -45deg,
        var(--bg-dark) 0px,
        var(--bg-dark) calc(var(--stripe-size)/2),
        #111 calc(var(--stripe-size)/2),
        #111 var(--stripe-size)
      );
      backface-visibility:hidden;
      will-change:transform;
    }

    .bg::after,
    .bg::before{
      content:"";
      position:absolute;
      inset:-18% -18%;
      pointer-events:none;
      mix-blend-mode:soft-light;
      backface-visibility:hidden;
      will-change:transform,opacity,background-position;
      z-index:0;
    }

    .bg::after{
      background:
        linear-gradient(
          -45deg,
          rgba(255,255,255,0) 28%,
          rgba(255,255,255,var(--wave-strong)) 50%,
          rgba(255,255,255,0) 72%
        );
      background-size: 200% 200%;
      animation:
        wave-vert var(--wave-time-main) ease-in-out infinite,
        wave-drift 18s linear infinite;
      opacity: 1;
    }

    .bg::before{
      background:
        linear-gradient(
          -45deg,
          rgba(255,255,255,0) 20%,
          rgba(255,255,255,var(--wave-soft-alpha)) 50%,
          rgba(255,255,255,0) 80%
        );
      filter: blur(10px);
      opacity: 0.95;
      background-size: 180% 180%;
      animation:
        wave-vert-soft var(--wave-time-soft) ease-in-out infinite,
        wave-drift-rev 22s linear infinite;
    }

    @keyframes wave-vert{
      0%   { transform: translate3d(0, 0, 0) scaleY(1); }
      40%  { transform: translate3d(0,-34px,0) scaleY(1.12); }
      60%  { transform: translate3d(0,-28px,0) scaleY(1.08); }
      100% { transform: translate3d(0, 0, 0) scaleY(1); }
    }

    @keyframes wave-vert-soft{
      0%   { transform: translate3d(0, 0, 0) scaleY(1); }
      50%  { transform: translate3d(0,-20px,0) scaleY(1.05); }
      100% { transform: translate3d(0, 0, 0) scaleY(1); }
    }

    @keyframes wave-drift{
      0%   { background-position: 0% 50%; }
      50%  { background-position: 60% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes wave-drift-rev{
      0%   { background-position: 0% 50%; }
      50%  { background-position: -50% 50%; }
      100% { background-position: 0% 50%; }
    }

    .light {
      position: fixed;
      right: -8vmax;
      bottom: -8vmax;
      width: 40vmax;
      height: 40vmax;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        circle at 70% 70%,
        rgba(255,255,255,0.06) 0%,
        rgba(255,255,255,0.035) 28%,
        rgba(255,255,255,0.02) 45%,
        rgba(255,255,255,0) 70%
      );
      mix-blend-mode: soft-light;
      filter: blur(36px);
      transform: translateZ(0);
      will-change: none;
      animation: none;
      opacity: 0.95;
    }

    .profile-card{
      width:698px;
      height:175px;
      max-width:92vw;
      background:rgba(20,20,20,0.92);
      border-radius:12px;
      padding:28px;
      box-shadow:0 10px 36px rgba(0,0,0,0.6);
      text-align:left;
      position:relative;
      z-index:1;
      opacity:0;
      transform:translateY(var(--card-offset)) scale(0.96);
      animation: cardEnter var(--card-duration) cubic-bezier(.16,.84,.24,1) forwards;
      animation-delay:var(--card-delay);
      will-change:transform,opacity;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    @keyframes cardEnter{
      0% { opacity:0; transform:translateY(var(--card-offset)) scale(0.96); }
      100% { opacity:1; transform:translateY(0) scale(1); }
    }

    .profile-header{
      display:flex;
      align-items:flex-start;
      gap:14px;
    }

    .profile-avatar{
      width:48px;
      height:48px;
      border-radius:50%;
      overflow:hidden;
      flex:0 0 48px;
      background:#222;
      display:inline-block;
    }
    .profile-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .profile-name{
      font-size:1.6rem;
      margin:0 0 6px 0;
      letter-spacing:1px;
      color:#fff;
    }

    .profile-bio{
      font-size:0.92rem;
      margin:0;
      color:#dcdcdc;
      line-height:1.45;
      flex:1 1 auto;
    }

    .profile-subtext{
      font-size: 0.88rem;
      margin: -2px 0 0 0;
      color: #aaa;
      line-height: 1.4;
    }


    .actions-card{
      width:720px;
      max-width:92vw;
      margin:0 auto;
      background:rgba(18,18,18,0.9);
      border-radius:12px;
      padding:12px 16px;
      box-shadow:0 8px 28px rgba(0,0,0,0.55);
      text-align:center;
      position:relative;
      z-index:1;
      opacity:0;
      transform:translateY(18px) scale(0.98);
      animation: actionsEnter var(--card-duration) cubic-bezier(.16,.84,.24,1) forwards;
      animation-delay: calc(var(--card-delay) + var(--actions-delay-offset));
      will-change:transform,opacity;
      display:flex;
      flex-direction:column;
      gap:10px;
      box-sizing:border-box;
      margin-top:12px;
    }

    @keyframes actionsEnter{
      0% { opacity:0; transform:translateY(18px) scale(0.98); }
      100% { opacity:1; transform:translateY(0) scale(1); }
    }

    .profile-actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:nowrap;
      overflow-x:auto;
      padding:6px 4px;
      -webkit-overflow-scrolling:touch;
    }

    .action-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:8px;
      background:#1b1b1b;
      color:#f2f2f2;
      text-decoration:none;
      font-weight:600;
      transition:background .18s ease, transform .12s ease;
      min-width:160px;
      justify-content:center;
      box-sizing:border-box;
      white-space:nowrap;
    }
    .action-btn:hover{ background:#2a2a2a; transform:translateY(-2px); }

    .action-btn .logo{ width:24px; height:24px; border-radius:50%; overflow:hidden; flex:0 0 24px; background:#111; display:inline-block; }
    .action-btn .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .action-btn .text{ display:inline-block; }

    .discord-btn{}
    .telegram-btn{}
    .steam-btn{}
    .roblox-btn{}

    @media (prefers-reduced-motion: reduce){
      .bg::after, .bg::before{ animation:none; }
      .profile-card, .actions-card{ animation:none; opacity:1; transform:none; }
    }

    @media (max-width:720px){
      .profile-card{ width:92vw; height:auto; }
      .actions-card{ width:90vw; }
    }

    @media (max-width:420px){
      .profile-card{ padding:18px; width:88vw; }
      .light{ right:-12vmax; bottom:-12vmax; width:60vmax; height:60vmax; filter:blur(48px); }
      .actions-card{ padding:12px; }
    }

    @media (max-width:480px) {
      .profile-card{
        width:92vw;
        height:auto;
        padding:18px;
        flex-direction:column;
        align-items:center;
        text-align:left;
        gap:12px;
      }
      .profile-header{
        flex-direction:column;
        align-items:center;
        gap:10px;
      }
      .profile-avatar{
        width:72px;
        height:72px;
        flex:0 0 72px;
      }
      .profile-name{
        font-size:1.4rem;
        margin:4px 0;
      }
      .profile-subtext{
        font-size:0.95rem;
        margin:0;
      }
      .profile-bio{
        font-size:0.98rem;
        margin-top:6px;
        line-height:1.45;
      }
      .actions-card{
        width:92vw;
        padding:12px;
      }
      .profile-actions{
        flex-direction:column;
        gap:10px;
        align-items:stretch;
      }
      .action-btn{
        min-width:unset;
        width:100%;
        font-size:1rem;
        padding:12px 14px;
        justify-content:flex-start;
      }
      .action-btn .logo{
        width:36px;
        height:36px;
        border-radius:50%;
        flex:0 0 36px;
      }
      .action-btn .text{
        margin-left:10px;
        text-align:left;
        flex:1;
      }
      .light{
        right:-12vmax;
        bottom:-12vmax;
      }
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="spinner"></div>
  </div>
  <div class="bg" aria-hidden="true"></div>
  <div class="light" aria-hidden="true"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:980px;">
    <div class="profile-card" role="region" aria-label="profile">
      <div class="profile-header">
        <label class="profile-avatar" aria-hidden="true">
          <img src="Avatar_round.png" alt="Аватар">
        </label>
        <div style="display:flex;flex-direction:column;flex:1;">
          <h2 class="profile-name">Kio</h2>
          <p class="profile-subtext">17 лет</p>
          </div>
        </div>
        <p class="profile-bio">Привет и добро пожаловать на мою страницу)<br>Что тут вообще писать?</p>
      <div style="flex:1 1 auto; display:flex; align-items:flex-end; justify-content:flex-start;">
      </div>
    </div>
    <div class="actions-card" role="region" aria-label="actions">
      <div class="profile-actions" aria-hidden="false">
        <a class="action-btn discord-btn" href="https://discord.com/users/884415163128758332" role="button" aria-label="Открыть Discord" rel="noopener noreferrer" target="_blank">
          <span class="logo" aria-hidden="true"><img src="Discord_logo500x500.png" alt="Дискорд"></span>
          <span class="text">Discord</span>
        </a>
        <a class="action-btn telegram-btn" href="https://t.me/Kio_SWCB/" role="button" aria-label="Открыть Telegram" rel="noopener noreferrer" target="_blank">
          <span class="logo" aria-hidden="true"><img src="Telegram_logo500x500.png" alt="Телеграм"></span>
          <span class="text">Telegram</span>
        </a>
        <a class="action-btn steam-btn" href="https://steamcommunity.com/id/conhost/" role="button" aria-label="Открыть Steam" rel="noopener noreferrer" target="_blank">
          <span class="logo" aria-hidden="true"><img src="Steam_logo500x500.png" alt="Стим"></span>
          <span class="text">Steam</span>
        </a>
        <a class="action-btn roblox-btn" href="https://www.roblox.com/users/3421812576/profile" role="button" aria-label="Открыть Roblox" rel="noopener noreferrer" target="_blank">
          <span class="logo" aria-hidden="true"><img src="Roblox_logo500x500.png" alt="Роблокс"></span>
          <span class="text">Roblox</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('load', function() {
      const preloader = document.getElementById('preloader');
      
      document.body.classList.add('loaded');

      preloader.style.opacity = '0';
      preloader.style.visibility = 'hidden';

      setTimeout(function(){
        preloader.style.display = 'none';
      }, 500);
    });
  </script>

</body>
</html>
